<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>JR Terminal - ARM64 Pure</title>
    <style>
        body {
            background-color: #0c0c0c;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        #terminal-output {
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
        }

        .input-line {
            display: flex;
            align-items: center;
        }

        .prompt {
            color: #5555ff;
            font-weight: bold;
            margin-right: 10px;
        }

        #command-input {
            background: transparent;
            border: none;
            color: #00ff00;
            font-family: inherit;
            font-size: inherit;
            outline: none;
            flex-grow: 1;
        }

        /* 模拟扫描线效果 */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="terminal-output">JR-OS v1.0.4 (aarch64)
Type 'help' to see available commands.
---------------------------------------</div>

    <div class="input-line">
        <span class="prompt">root@jr-cloud:~#</span>
        <input type="text" id="command-input" autofocus spellcheck="false">
    </div>

    <script>
        const output = document.getElementById('terminal-output');
        const input = document.getElementById('command-input');

        // 模拟基础命令逻辑
        const commands = {
            'help': 'Available: help, clear, ls, whoami, music, asm',
            'ls': 'music_player.swift  fight_game.js  asm_core.s  secret.txt',
            'whoami': 'root (JR General Affairs)',
            'music': 'Playing: Alan Walker - Faded (8-bit Assembly Mix)...',
            'asm': 'MOV X0, #1 \nSTR X0, [SP, #16]\nLDR W0, [SP, #16]\nRET',
            'clear': () => { output.innerHTML = ''; return ''; }
        };

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const fullCommand = input.value.trim().toLowerCase();
                const response = commands[fullCommand] || `sh: command not found: ${fullCommand}`;
                
                // 打印提示符和命令
                output.innerHTML += `\n<span style="color: #5555ff">root@jr-cloud:~#</span> ${input.value}`;
                
                // 执行逻辑
                if (typeof response === 'function') {
                    response();
                } else {
                    output.innerHTML += `\n${response}`;
                }

                // 自动滚到底部
                input.value = '';
                output.scrollTop = output.scrollHeight;
            }
        });

        // 点击页面任何地方都聚焦输入框
        document.addEventListener('click', () => input.focus());
    </script>
</body>
</html>
